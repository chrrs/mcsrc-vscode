<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./vscode-web/code-192.png" />

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">

    <link rel="icon" href="./vscode-web/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="./vscode-web/manifest.json" />

    <link data-name="vs/workbench/workbench.web.main" rel="stylesheet"
        href="./vscode-web/out/vs/workbench/workbench.web.main.css" />

<body aria-label="">
</body>

<script src="./vscode-web/out/vs/loader.js"></script>
<script src="./vscode-web/out/vs/webPackagePaths.js"></script>

<script>
    Object.keys(self.webPackagePaths).map(function (key, index) {
        self.webPackagePaths[key] = `${window.location.origin}/vscode-web/node_modules/${key}/${self.webPackagePaths[key]}`;
    });

    require.config({
        baseUrl: `${window.location.origin}/vscode-web/out`,
        recordStats: true,
        trustedTypesPolicy: window.trustedTypes?.createPolicy('amdLoader', {
            createScriptURL(value) {
                return value;
            }
        }),
        paths: self.webPackagePaths
    });
</script>

<script src="./vscode-web/out/vs/workbench/workbench.web.main.nls.js"></script>
<script src="./vscode-web/out/vs/workbench/workbench.web.main.js"></script>
<script src="./vscode-web/out/vs/code/browser/workbench/workbench.js"></script>

</html>
